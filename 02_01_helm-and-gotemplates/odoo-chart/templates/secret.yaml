{{/*
=============================================================================
SECRET — Données sensibles (mot de passe PostgreSQL)
=============================================================================

Un Secret Kubernetes stocke des données sensibles en base64.
IMPORTANT : base64 ≠ chiffrement. C'est un encodage réversible.
  echo -n "odoo_password" | base64  →  b2Rvb19wYXNzd29yZA==
  echo "b2Rvb19wYXNzd29yZA==" | base64 -d  →  odoo_password

Pourquoi base64 ?
  Les Secrets K8s doivent être en base64 par convention de l'API.
  La valeur brute "odoo_password" ne passerait pas la validation de l'API.

Sécurité réelle d'un Secret Kubernetes :
  ✓ Séparé du ConfigMap → accès RBAC différencié possible
  ✓ Non affiché dans les logs kubectl par défaut
  ✗ Stocké en clair dans etcd (sauf si chiffrement at-rest activé)
  ✗ Visible en base64 pour tout opérateur avec kubectl get secret

En production : utiliser Vault (HashiCorp), Sealed Secrets ou SOPS
pour ne jamais committer de valeurs réelles dans le dépôt Git.

Fonction Go template | b64enc :
  Encode automatiquement la valeur en base64.
  Équivalent à : echo -n "valeur" | base64
  Exemple : "odoo_password" | b64enc → "b2Rvb19wYXNzd29yZA=="

Important : ne jamais stocker le vrai mot de passe en clair dans values.yaml.
Surcharger lors du déploiement :
  helm install odoo ./odoo-chart --set postgresql.password=$SECRET_FROM_VAULT
=============================================================================
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoo.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
type: Opaque
# type: Opaque = données arbitraires (par opposition à kubernetes.io/tls, etc.)
data:
  # b64enc encode la valeur lue depuis .Values.postgresql.password en base64
  # | quote ajoute des guillemets pour garantir que YAML traite ça comme une string
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | b64enc | quote }}
  PGPASSWORD: {{ .Values.postgresql.password | b64enc | quote }}
