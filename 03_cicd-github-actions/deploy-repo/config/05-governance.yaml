#@ load("@ytt:data", "data")
#@ load("helpers.lib.yaml", "common_labels", "selector_labels")

#! =============================================================================
#! GOUVERNANCE - NetworkPolicies + ResourceQuota + LimitRange
#! =============================================================================
#! Regles de securite reseau et bornes de consommation du namespace.
#! Peu de valeurs varient ici : surtout le namespace et les labels.
#! =============================================================================

#! --- NetworkPolicy 1 : seule Odoo peut joindre PostgreSQL ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-netpol
  namespace: #@ data.values.namespace
  labels: #@ common_labels("postgresql", "database")
spec:
  podSelector:
    matchLabels: #@ selector_labels("postgresql")
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels: #@ selector_labels("odoo")
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - {}

---
#! --- NetworkPolicy 2 : Odoo joignable depuis l'Ingress, sortie vers DNS + BDD ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odoo-netpol
  namespace: #@ data.values.namespace
  labels: #@ common_labels("odoo", "application")
spec:
  podSelector:
    matchLabels: #@ selector_labels("odoo")
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8069
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels: #@ selector_labels("postgresql")
      ports:
        - protocol: TCP
          port: 5432

---
#! --- ResourceQuota : plafond global du namespace ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: odoo-quota
  namespace: #@ data.values.namespace
  labels: #@ common_labels("odoo", "governance")
spec:
  hard:
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    persistentvolumeclaims: "5"

---
#! --- LimitRange : bornes par conteneur (min 50m/64Mi, voir Sprint 1) ---
apiVersion: v1
kind: LimitRange
metadata:
  name: odoo-limitrange
  namespace: #@ data.values.namespace
  labels: #@ common_labels("odoo", "governance")
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
