# =============================================================================
# DEPLOYMENT - Application Odoo avec init containers et sidecar Fluent Bit
# =============================================================================
#
# Correctifs apportes :
#   1. initContainer "odoo-db-init" qui initialise le schema de la base AVANT
#      le conteneur principal. Corrige le bug d'origine ("-i base" sans
#      "-d odoo_db" n'initialise rien : KeyError 'ir.http',
#      relation "ir_module_module" does not exist, puis boucle de restart).
#   2. Le conteneur principal ne fait plus l'init : il sert l'application
#      avec "-d odoo_db".
#   3. startupProbe pour couvrir le demarrage d'Odoo sans que la livenessProbe
#      ne tue le pod trop tot.
#   4. requests/limits de "wait-for-postgresql" releves au plancher impose par
#      le LimitRange du namespace (min 50m CPU / 64Mi memoire par conteneur).
#      Avant : 10m/16Mi -> refuse par le LimitRange, aucun pod cree
#      (Error FailedCreate: minimum cpu usage per Container is 50m...).
#   5. Image alignee sur odoo:19.0 pour l'init ET le conteneur principal.
#      Init et service doivent utiliser la MEME version, sinon risque d'erreur
#      de migration de schema (init en 16, service en 19).
#
# Structure du pod - QUATRE conteneurs (2 init + 2 principaux) :
#   1. wait-for-postgresql  -> INIT : attend que la BDD soit joignable (TCP)
#   2. odoo-db-init         -> INIT : initialise le schema (-i base) puis stop
#   3. odoo                 -> conteneur principal : l'application
#   4. log-exporter         -> SIDECAR Fluent Bit : collecte les logs Odoo
#
# NOTE sur le LimitRange : il s'applique a TOUS les conteneurs, initContainers
# compris. Chaque conteneur doit donc respecter le minimum. Verifier les bornes
# avec : kubectl describe limitrange -n odoo (colonnes Min / Max / Default).
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/instance: odoo
    app.kubernetes.io/component: application
spec:
  replicas: 1     # Une seule instance pour ce sprint.
                  # NE PAS depasser 1 replica tant que l'init se fait dans un
                  # initContainer sur chaque pod : plusieurs pods tenteraient
                  # d'initialiser la meme base en parallele (race condition).

  selector:
    matchLabels:
      app.kubernetes.io/name: odoo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
        app.kubernetes.io/instance: odoo
        app.kubernetes.io/component: application

    spec:
      # ─── INIT CONTAINERS (executes dans l'ordre, avant les principaux) ─────
      initContainers:

        # ── Init 1 : attente de PostgreSQL ──────────────────────────────────
        - name: wait-for-postgresql
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              # Teste la connexion TCP sur le port 5432 jusqu'a succes.
              until nc -z postgresql-svc 5432; do
                echo "PostgreSQL pas encore pret, nouvelle tentative dans 2s..."
                sleep 2
              done
              echo "PostgreSQL est pret."
          resources:
            requests:
              cpu: 50m       # aligne sur le minimum du LimitRange (etait 10m)
              memory: 64Mi   # aligne sur le minimum du LimitRange (etait 16Mi)
            limits:
              cpu: 100m      # >= requests, et memory limit >= 64Mi (etait 32Mi)
              memory: 128Mi

        # ── Init 2 : initialisation du schema Odoo ──────────────────────────
        # Cible explicitement la base avec "-d odoo_db" (le correctif cle).
        # "--stop-after-init" : Odoo initialise puis s'arrete (exit 0), ce qui
        # permet a Kubernetes de passer au conteneur principal.
        # Idempotent : au redemarrage, si la base est deja initialisee,
        # "-i base" est ignore et ce conteneur ressort quasi immediatement.
        - name: odoo-db-init
          image: odoo:19.0
          args:
            - -d
            - odoo_db
            - -i
            - base
            - --without-demo=all   # retirer cette ligne pour charger les demos
            - --stop-after-init
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: PORT
            - name: USER
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      # ─── CONTENEURS PRINCIPAUX ────────────────────────────────────────────
      containers:

        # ── Conteneur 1 : Odoo ──────────────────────────────────────────────
        - name: odoo
          image: odoo:19.0   # alignee sur odoo-db-init (etait 16.0)
          # Plus de "-i base" ici : l'init est faite par l'initContainer.
          # On cible juste la base pour eviter tout auto-select ambigu.
          args:
            - -d
            - odoo_db

          ports:
            - containerPort: 8069
              name: http
            - containerPort: 8072
              name: longpolling

          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: PORT
            - name: USER
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_PASSWORD

          # STARTUP PROBE - couvre la phase de demarrage.
          # Tant qu'elle n'a pas reussi, liveness et readiness sont suspendues.
          # 18 echecs x 10s = jusqu'a 180s de marge de demarrage.
          startupProbe:
            httpGet:
              path: /web/health
              port: 8069
            periodSeconds: 10
            failureThreshold: 18

          # LIVENESS PROBE - le conteneur est-il encore vivant ?
          livenessProbe:
            httpGet:
              path: /web/health
              port: 8069
            periodSeconds: 15
            failureThreshold: 5

          # READINESS PROBE - le pod est-il pret a recevoir du trafic ?
          readinessProbe:
            httpGet:
              path: /web/health
              port: 8069
            periodSeconds: 10

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo
            - name: odoo-logs
              mountPath: /var/log/odoo

        # ── Conteneur 2 : Fluent Bit (sidecar log-exporter) ─────────────────
        - name: log-exporter
          image: fluent/fluent-bit:2.1.10
          args:
            - "-c"
            - "/fluent-bit/etc/fluent-bit.conf"
          volumeMounts:
            - name: odoo-logs
              mountPath: /var/log/app
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
          resources:
            requests:
              cpu: 50m       # exactement le minimum du LimitRange, conforme
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

      # ─── VOLUMES du pod ────────────────────────────────────────────────────
      volumes:
        - name: odoo-data
          emptyDir: {}
          # Sprint : donnees ephemeres. Production : remplacer par un PVC.
        - name: odoo-logs
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config

# =============================================================================
# NOTE : le nom de la base est passe via l'argument "-d odoo_db". Odoo n'a pas
# de variable d'environnement native pour cela, le flag -d est la bonne methode.
#
# RAPPEL LimitRange : si le pod refuse encore de se creer apres ces valeurs,
# lancer "kubectl describe limitrange -n odoo" et verifier :
#   - Min : chaque requests doit etre >= Min (CPU et memoire)
#   - Max : chaque limits doit etre <= Max (attention au 1 CPU / 1Gi ci-dessus)
# =============================================================================
