# =============================================================================
# SECRET — Données sensibles (mots de passe, tokens, clés)
# =============================================================================
#
# Un Secret est similaire à un ConfigMap mais conçu pour les données sensibles.
# Les valeurs sont stockées encodées en base64 (PAS chiffrées par défaut).
#
# IMPORTANT — base64 ≠ chiffrement :
#   base64 est un encodage réversible sans clé secrète.
#   echo -n "odoo_password" | base64   →  b2Rvb19wYXNzd29yZA==
#   echo "b2Rvb19wYXNzd29yZA==" | base64 -d  →  odoo_password
#
#   En production, sécuriser les Secrets avec :
#     - Chiffrement at-rest dans etcd (EncryptionConfiguration)
#     - Gestionnaires externes : HashiCorp Vault, AWS Secrets Manager
#     - SOPS (utilisé dans les Sprints 3 et 6 de ce programme)
#
# Le flag -n dans echo -n évite d'encoder le saut de ligne final (sinon la valeur
# décodée contiendrait un \n invisible qui causerait des erreurs d'authentification).
#
# Dans ce sprint : valeurs en clair pour faciliter l'apprentissage.
# NE JAMAIS committer des secrets en clair dans un vrai projet.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: odoo-secret     # Référencé dans les Deployments via secretKeyRef
  namespace: odoo
type: Opaque            # Type "Opaque" = données arbitraires (le plus courant)
                        # Autres types : kubernetes.io/tls, kubernetes.io/dockerconfigjson
data:
  # Toutes les valeurs DOIVENT être encodées en base64

  POSTGRES_PASSWORD: b2Rvb19wYXNzd29yZA==
  # Valeur décodée : "odoo_password"
  # Utilisé par PostgreSQL pour créer l'utilisateur odoo_user au premier démarrage

  PGPASSWORD: b2Rvb19wYXNzd29yZA==
  # Valeur décodée : "odoo_password"
  # Variable reconnue par les outils psql/pg_isready pour l'authentification

  ODOO_ADMIN_PASSWD: b2Rvb19hZG1pbl9wYXNz
  # Valeur décodée : "odoo_admin_pass"
  # Mot de passe du compte administrateur Odoo (interface web)
